[project]
name = "vigilo-orchestrator"
version = "0.1.0"
description = "Vigilo orchestrator: scan lifecycle (plan, enqueue, track, assemble, finalise)"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "vigilo-core",
    "vigilo-persistence",
    "vigilo-security",
    "vigilo-probes",
    "vigilo-checks",
    "vigilo-scoring",
    "vigilo-integrations",
    "vigilo-identity",
    "vigilo-project",
    "vigilo-reporting",
]

[dependency-groups]
dev = ["pytest-asyncio>=0.24"]

[tool.uv.sources]
vigilo-core = { workspace = true }
vigilo-persistence = { workspace = true }
vigilo-security = { workspace = true }
vigilo-probes = { workspace = true }
vigilo-checks = { workspace = true }
vigilo-scoring = { workspace = true }
vigilo-integrations = { workspace = true }
vigilo-identity = { workspace = true }
vigilo-project = { workspace = true }
vigilo-reporting = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vigilo_orchestrator"]
