[project]
name = "vigilo-notification"
version = "0.1.0"
description = "Vigilo notification: renders and delivers alert emails"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "vigilo-core",
    "vigilo-integrations",
]

[dependency-groups]
dev = ["pytest-asyncio>=0.24"]

[tool.uv.sources]
vigilo-core = { workspace = true }
vigilo-integrations = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vigilo_notification"]
