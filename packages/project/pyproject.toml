[project]
name = "vigilo-project"
version = "0.1.0"
description = "Vigilo project: projects, targets, ownership proofs, quotas"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "vigilo-core",
    "vigilo-persistence",
    "vigilo-identity",
]

[dependency-groups]
dev = ["pytest-asyncio>=0.24"]

[tool.uv.sources]
vigilo-core = { workspace = true }
vigilo-persistence = { workspace = true }
vigilo-identity = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vigilo_project"]
