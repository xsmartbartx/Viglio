[project]
name = "vigilo-security"
version = "0.1.0"
description = "Vigilo security: egress guard (SSRF defense), authorization, redaction gate"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "vigilo-core",
    "vigilo-persistence",
    "dnspython>=2.6",
    "httpx>=0.28",
]

[dependency-groups]
dev = ["pytest-asyncio>=0.24"]

[tool.uv.sources]
vigilo-core = { workspace = true }
vigilo-persistence = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vigilo_security"]
