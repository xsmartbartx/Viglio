[project]
name = "vigilo-billing"
version = "0.1.0"
description = "Vigilo billing: entitlement resolution and quota decisions, pure"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "vigilo-core",
]

[tool.uv.sources]
vigilo-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vigilo_billing"]
