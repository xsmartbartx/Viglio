[project]
name = "vigilo-probes"
version = "0.1.0"
description = "Vigilo probes: collect evidence about a target — the only module that talks to it"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "httpx>=0.28",
    "vigilo-core",
    "vigilo-security",
]

[dependency-groups]
dev = [
    "pytest-asyncio>=0.24",
    # Test-only: generates a throwaway self-signed cert for test_tls_probe.py's
    # local TLS fixture server. Not a production dependency (see ADR-0002).
    "cryptography>=43",
]

[tool.uv.sources]
vigilo-core = { workspace = true }
vigilo-security = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vigilo_probes"]
