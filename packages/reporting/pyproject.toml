[project]
name = "vigilo-reporting"
version = "0.1.0"
description = "Vigilo reporting: render findings for humans — HTML report data, PDF, badge"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "vigilo-core",
    "playwright>=1.48",
]

[dependency-groups]
dev = ["pytest-asyncio>=0.24"]

[tool.uv.sources]
vigilo-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vigilo_reporting"]
