[project]
name = "vigilo-integrations"
version = "0.1.0"
description = "Vigilo integrations: transactional email (Postmark), object storage (MinIO/S3)"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "vigilo-core",
    "httpx>=0.28",
    "boto3>=1.34",
]

[dependency-groups]
dev = ["pytest-asyncio>=0.24"]

[tool.uv.sources]
vigilo-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vigilo_integrations"]
