[project]
name = "vigilo-persistence"
version = "0.1.0"
description = "Vigilo persistence: SQLAlchemy Base, async engine/session factory, Alembic wiring"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "vigilo-core",
]

[dependency-groups]
dev = ["pytest-asyncio>=0.24"]

[tool.uv.sources]
vigilo-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vigilo_persistence"]
