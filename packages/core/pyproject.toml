[project]
name = "vigilo-core"
version = "0.1.0"
description = "Vigilo core: domain models, validation, logging, errors, redaction, config"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vigilo_core"]
