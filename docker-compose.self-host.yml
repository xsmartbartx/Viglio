# Self-hosted deployment (docs/self-hosting.md, Phase 9) — builds and runs
# the three application images (apps/api, apps/scanner, apps/web) alongside
# their infrastructure. Distinct from docker-compose.yml, which only runs
# infrastructure for local development against apps run directly with
# `uv run`/`npm run dev`.
#
# Copy .env.example to .env and fill in real values before running:
#   docker compose -f docker-compose.self-host.yml up -d --build
#   docker compose -f docker-compose.self-host.yml exec api \
#     uv run alembic -c packages/persistence/alembic.ini upgrade head

name: vigilo-self-host

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vigilo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vigilo-dev-secret}
      POSTGRES_DB: vigilo
    volumes:
      - vigilo_self_host_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vigilo -d vigilo"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - vigilo_self_host_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: vigilo
      MINIO_ROOT_PASSWORD: ${OBJECT_STORE_SECRET_KEY:-vigilo-dev-secret}
    ports:
      # Console only — object access goes through the api/scanner containers
      # on the internal network, never the host.
      - "127.0.0.1:9011:9001"
    volumes:
      - vigilo_self_host_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 vigilo ${OBJECT_STORE_SECRET_KEY:-vigilo-dev-secret} &&
      mc mb -p local/vigilo-evidence &&
      exit 0
      "

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      ENV: production
      DATABASE_URL: postgresql+asyncpg://vigilo:${POSTGRES_PASSWORD:-vigilo-dev-secret}@postgres:5432/vigilo
      REDIS_URL: redis://redis:6379/0
      OBJECT_STORE_ENDPOINT: http://minio:9000
      OBJECT_STORE_ACCESS_KEY: vigilo
      OBJECT_STORE_SECRET_KEY: ${OBJECT_STORE_SECRET_KEY:-vigilo-dev-secret}
      OBJECT_STORE_BUCKET: vigilo-evidence
      VIGILO_BRAND_CONFIG_PATH: /app/brand.config.json
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?set CLERK_SECRET_KEY in .env}
      CLERK_JWKS_URL: ${CLERK_JWKS_URL:?set CLERK_JWKS_URL in .env}
      POSTMARK_SERVER_TOKEN: ${POSTMARK_SERVER_TOKEN:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-scans@vigilo.io}
      WEB_APP_URL: ${WEB_APP_URL:-http://localhost:3000}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5}
      PADDLE_VENDOR_ID: ${PADDLE_VENDOR_ID:-}
      PADDLE_WEBHOOK_SECRET: ${PADDLE_WEBHOOK_SECRET:-}
      PADDLE_PRICE_ID_BUILDER: ${PADDLE_PRICE_ID_BUILDER:-}
      PADDLE_PRICE_ID_STUDIO: ${PADDLE_PRICE_ID_STUDIO:-}
      PADDLE_PRICE_ID_BUSINESS: ${PADDLE_PRICE_ID_BUSINESS:-}

  scanner:
    build:
      context: .
      dockerfile: apps/scanner/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      ENV: production
      DATABASE_URL: postgresql+asyncpg://vigilo:${POSTGRES_PASSWORD:-vigilo-dev-secret}@postgres:5432/vigilo
      REDIS_URL: redis://redis:6379/0
      OBJECT_STORE_ENDPOINT: http://minio:9000
      OBJECT_STORE_ACCESS_KEY: vigilo
      OBJECT_STORE_SECRET_KEY: ${OBJECT_STORE_SECRET_KEY:-vigilo-dev-secret}
      OBJECT_STORE_BUCKET: vigilo-evidence
      VIGILO_BRAND_CONFIG_PATH: /app/brand.config.json
      WEB_APP_URL: ${WEB_APP_URL:-http://web:3000}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5}
      POSTMARK_SERVER_TOKEN: ${POSTMARK_SERVER_TOKEN:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-scans@vigilo.io}

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:8000}
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:?set NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY in .env}
        NEXT_PUBLIC_CLERK_JWT_TEMPLATE: ${NEXT_PUBLIC_CLERK_JWT_TEMPLATE:-vigilo-api}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:3000"
    environment:
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?set CLERK_SECRET_KEY in .env}

volumes:
  vigilo_self_host_postgres_data:
  vigilo_self_host_redis_data:
  vigilo_self_host_minio_data:
