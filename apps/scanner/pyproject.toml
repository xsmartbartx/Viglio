[project]
name = "vigilo-scanner"
version = "0.1.0"
description = "Vigilo scanner: the ARQ worker running in the isolated scan zone"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "arq>=0.26",
    "vigilo-core",
    "vigilo-security",
    "vigilo-probes",
    "vigilo-checks",
    "vigilo-scoring",
    "vigilo-orchestrator",
    "vigilo-integrations",
    "vigilo-persistence",
    "vigilo-project",
    "vigilo-reporting",
    "vigilo-identity",
    "vigilo-billing",
    "vigilo-monitoring",
    "vigilo-notification",
]

[dependency-groups]
dev = ["pytest-asyncio>=0.24"]

[tool.uv.sources]
vigilo-core = { workspace = true }
vigilo-security = { workspace = true }
vigilo-probes = { workspace = true }
vigilo-checks = { workspace = true }
vigilo-scoring = { workspace = true }
vigilo-orchestrator = { workspace = true }
vigilo-integrations = { workspace = true }
vigilo-persistence = { workspace = true }
vigilo-project = { workspace = true }
vigilo-reporting = { workspace = true }
vigilo-identity = { workspace = true }
vigilo-billing = { workspace = true }
vigilo-monitoring = { workspace = true }
vigilo-notification = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vigilo_scanner"]
