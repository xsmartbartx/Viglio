[project]
name = "vigilo-api"
version = "0.1.0"
description = "Vigilo API — control-plane HTTP surface (Phase 0: health/version bootstrap only)"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "vigilo-core",
    "vigilo-security",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
]

[tool.uv.sources]
vigilo-core = { workspace = true }
vigilo-security = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vigilo_api"]
