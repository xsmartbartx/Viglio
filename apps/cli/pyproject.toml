[project]
name = "vigilo-cli"
version = "0.1.0"
description = "Vigilo CLI: vigilo scan <url> for CI pipelines and local use"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "vigilo-core",
    "vigilo-security",
    "vigilo-probes",
    "vigilo-checks",
    "vigilo-scoring",
    "vigilo-reporting",
]

[project.scripts]
vigilo = "vigilo_cli.main:run"

[tool.uv.sources]
vigilo-core = { workspace = true }
vigilo-security = { workspace = true }
vigilo-probes = { workspace = true }
vigilo-checks = { workspace = true }
vigilo-scoring = { workspace = true }
vigilo-reporting = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vigilo_cli"]
